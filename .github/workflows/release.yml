name: Release Packaging & Publishing

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Tarball
        run: |
          tar -czf "Termux-zsh-${{ github.ref_name }}.tar.gz" --exclude='.git' --exclude='.github' .
          sha256sum "Termux-zsh-${{ github.ref_name }}.tar.gz" > "Termux-zsh-${{ github.ref_name }}.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Termux-zsh-${{ github.ref_name }}.tar.gz
            Termux-zsh-${{ github.ref_name }}.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
